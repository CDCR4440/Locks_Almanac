# Rebuild the embed from the Substack RSS feed and publish it with GitHub Pages.
# The feed is downloaded on the runner directly from Substack.
# Do not route this through rss2json or any other proxy.
#
# Pull requests only build the page, so the log shows the posts that were found.
# Pushes to main, the 6-hour schedule, and Run workflow also deploy to Pages.

name: Publish Substack embed

on:
  schedule:
    # Every 6 hours. GitHub runs this in UTC and may start it a few minutes late.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Linux GitHub-hosted runners are challenged by Cloudflare on substack.com
  # ("Just a moment..."). macOS runners are not in that same address block.
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the page builder
        run: python3 scripts/build_site.py --self-test

      # Python and curl first. No extra packages, so a runner that can reach
      # Substack publishes immediately.
      - name: Build the embed from the Substack feed
        id: quick
        continue-on-error: true
        run: python3 scripts/build_site.py

      # Same Substack URL, with a browser TLS fingerprint. Not an RSS proxy.
      - name: Retry with a browser TLS fingerprint
        id: cffi
        if: steps.quick.outcome == 'failure'
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages "curl-cffi==0.17.0"
          python3 scripts/build_site.py

      # Cloudflare sometimes serves a JavaScript challenge. Chromium still
      # requests Substack directly.
      - name: Retry the direct request in Chromium
        id: browser
        if: steps.quick.outcome == 'failure' && steps.cffi.outcome == 'failure'
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages playwright
          python3 -m playwright install chromium
          python3 scripts/build_site.py --browser

      - name: Fail if Substack could not be read
        if: steps.quick.outcome == 'failure' && steps.cffi.outcome == 'failure' && steps.browser.outcome == 'failure'
        run: exit 1

      - name: Upload the built site
        if: steps.quick.outcome == 'success' || steps.cffi.outcome == 'success' || steps.browser.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: substack-embed
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One Pages deployment at a time. Do not cancel a deploy already in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: substack-embed
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
