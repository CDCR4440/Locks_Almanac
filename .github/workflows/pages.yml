# Rebuild the embed from Substack and publish it with GitHub Pages.
# The feed is downloaded on the runner directly from Substack.
# Do not route this through rss2json or any other proxy.
#
# Plain HTTP often gets Cloudflare's "Just a moment..." page on GitHub's
# servers. The builder then opens the same Substack URL in Chrome. If Substack
# is still unreachable, the script keeps the saved site/ pages, prints a
# warning, and exits 0 so this workflow stays green.
#
# Pull requests only build the page, so the log shows the posts that were found.
# Pushes to main, the 6-hour schedule, and Run workflow also deploy to Pages.

name: Publish Substack embed

on:
  schedule:
    # Every 6 hours. GitHub runs this in UTC and may start it a few minutes late.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the page builder
        run: python3 scripts/build_site.py --self-test

      # Direct request only. curl-cffi is a browser TLS fingerprint for that
      # same Substack URL, not an RSS proxy. Playwright drives the Chrome
      # already installed on the runner when Cloudflare challenges the plain
      # clients. The script leaves site/ in place and exits 0 if Substack
      # cannot be reached at all.
      - name: Build the embed from the Substack feed
        run: |
          python3 -m pip install --disable-pip-version-check "curl-cffi==0.17.0" "playwright==1.64.1"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          # A real display keeps Chrome from calling itself HeadlessChrome.
          # Cloudflare leaves that client on the "Just a moment..." page.
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a python3 scripts/build_site.py
          else
            python3 scripts/build_site.py
          fi
          test -f site/index.html
          test -f site/embed.html

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: substack-embed
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One Pages deployment at a time. Do not cancel a deploy already in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: substack-embed
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
